<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — Tharsos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <div id="global-header"></div>

  <main>
    <section class="mission-hero" style="padding: 80px 24px; min-height: 300px;">
      <div>
        <h1 id="collection-title" style="font-size: clamp(2.5rem, 6vw, 4rem);">Loading...</h1>
        <p id="collection-desc" style="font-size: 1.1rem; margin-top: 16px;"></p>
      </div>
    </section>

    <section class="bestsellers">
      <div class="grid" id="collection-products-grid">
        <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Loading products...</p>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>
  <script type="module" src="collection.js?v=20"></script>
</body>
</html>
